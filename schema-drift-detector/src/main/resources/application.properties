spring.application.name=schema-drift-detector

# --- MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/schema_drift_db
spring.datasource.username=root
spring.datasource.password=changeme
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_256_BITS
app.jwt.expiration-ms=86400000

# --- Gemini AI ---
app.gemini.api-key=YOUR_GEMINI_API_KEY
app.gemini.model=gemini-1.5-flash
